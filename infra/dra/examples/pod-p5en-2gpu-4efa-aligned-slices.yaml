apiVersion: v1
kind: Pod
metadata:
  name: pod-p5en-2gpu-4efa-aligned-slices
spec:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node.kubernetes.io/instance-type: p5en.48xlarge
  resourceClaims:
    - name: 2g4e-0
      resourceClaimTemplateName: aws-p5en-2gpu-4efa-aligned
    - name: 2g4e-1
      resourceClaimTemplateName: aws-p5en-2gpu-4efa-aligned
  containers:
    - name: main
      image: nvidia/cuda:13.0.2-devel-amzn2023
      command: ["bash", "-c", "sleep infinity"]
      resources:
        claims:
          - name: 2g4e-0
          - name: 2g4e-1
