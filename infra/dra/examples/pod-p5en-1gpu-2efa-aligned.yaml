apiVersion: v1
kind: Pod
metadata:
  name: p5en-1gpu-2efa-aligned
spec:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node.kubernetes.io/instance-type: p5en.48xlarge
  resourceClaims:
    - name: 1g2e-0
      resourceClaimTemplateName: aws-1gpu-2efa-aligned
    - name: 1g2e-1
      resourceClaimTemplateName: aws-1gpu-2efa-aligned
  containers:
    - name: main
      image: nvidia/cuda:13.0.2-devel-amzn2023
      command: ["bash", "-c", "sleep infinity"]
      resources:
        claims:
          - name: 1g2e-0
          - name: 1g2e-1
