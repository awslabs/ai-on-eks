apiVersion: v1
kind: Pod
metadata:
  name: gpu-efa
spec:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node.kubernetes.io/instance-type: g6e.12xlarge
  resourceClaims:
    - name: gpu-0
      resourceClaimTemplateName: gpu
    - name: gpu-1
      resourceClaimTemplateName: gpu
    - name: efa-0
      resourceClaimTemplateName: efa
  containers:
    - name: main
      image: nvidia/cuda:13.0.2-devel-amzn2023
      command: ["bash", "-c", "sleep infinity"]
      resources:
        claims:
          - name: gpu-0
          - name: gpu-1
          - name: efa-0
