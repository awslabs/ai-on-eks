# Reference AgentSandbox instance — demonstrates the KRO
# composition pattern. Creates a ServiceAccount + Sandbox from a
# single declarative unit via the ResourceGraphDefinition at
# rgd-agent-sandbox.yaml. Contrast with sandbox-agent.yaml, which
# stages both primitives explicitly: the AgentSandbox view is what
# a customer would see after adopting the blueprint.
#
# Egress policy enforcement is provided by the sibling
# CiliumNetworkPolicy (ciliumnetworkpolicy-sandbox-llm.yaml) — the
# AgentSandbox's podTemplate stamps an `egress-tier: sandbox` label
# that the policy's endpointSelector matches, so the composition is
# complete once both resources are applied to the same namespace.
apiVersion: custom.agents.x-k8s.io/v1alpha1
kind: AgentSandbox
metadata:
  name: composed-sandbox
  namespace: agent-sandboxes
spec:
  image: python:3.12-slim
  runtimeClass: gvisor
  # iamRoleArn: replaced at apply time via sed substitution on
  # __BEDROCK_ROLE_ARN__. Point at the same IAM role as the
  # standalone sandbox-agent.yaml — IRSA trust policy must include
  # system:serviceaccount:agent-sandboxes:composed-sandbox.
  iamRoleArn: "__BEDROCK_ROLE_ARN__"
  command:
    - /bin/sh
    - -c
    - "sleep infinity"
