# Reference AgentSandbox instance — demonstrates the KRO
# composition pattern. Creates a ServiceAccount + Sandbox running
# the reference agent from a single declarative unit via the
# ResourceGraphDefinition at rgd-agent-sandbox.yaml.
#
# Contrast with sandbox-agent.yaml, which stages the ServiceAccount,
# ConfigMap, and Sandbox explicitly across ~130 lines. The AgentSandbox
# form collapses the declaration to this ~20-line instance. Both
# paths produce an equivalent running pod — the composition view is
# what a customer adopting the blueprint would typically apply.
#
# Egress policy enforcement is provided by the sibling
# CiliumNetworkPolicy (ciliumnetworkpolicy-sandbox-llm.yaml) or the
# native ApplicationNetworkPolicy — the AgentSandbox's podTemplate
# stamps an `egress-tier: sandbox` label that the policy's
# endpointSelector / podSelector matches, so the composition is
# complete once both resources are applied to the same namespace.
#
# Prerequisites:
#   1. The reference agent ConfigMap (`sandbox-agent-script`) must
#      exist in the target namespace. install.sh populates it from
#      blueprints/agents/agent-sandbox/agent.py. The AgentSandbox
#      mounts it at /config and cp's it to /workspace/agent.py on
#      container start.
#   2. The IAM role referenced by iamRoleArn must include both the
#      direct sandbox-agent-sa AND this AgentSandbox name
#      (`composed-sandbox`) in its IRSA trust policy subject list.
apiVersion: custom.agents.x-k8s.io/v1alpha1
kind: AgentSandbox
metadata:
  name: composed-sandbox
  namespace: agent-sandboxes
spec:
  image: python:3.12-slim
  runtimeClass: gvisor
  # iamRoleArn: replaced at apply time via sed substitution on
  # __BEDROCK_ROLE_ARN__. Point at the same IAM role as the
  # standalone sandbox-agent.yaml — IRSA trust policy must include
  # system:serviceaccount:agent-sandboxes:composed-sandbox.
  iamRoleArn: "__BEDROCK_ROLE_ARN__"
  # Script ConfigMap to mount at /config. Shared with the direct
  # sandbox-agent.yaml path so both forms exercise the same
  # reference agent without duplicating the ConfigMap.
  scriptConfigMap: sandbox-agent-script
