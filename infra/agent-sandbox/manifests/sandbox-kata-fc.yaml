# SandboxTemplate — Kata + Firecracker tier (basic).
#
# Same shape as sandbox-runc / sandbox-gvisor plus runtimeClassName:
# kata-fc and the matching NodePool toleration. Each sandbox runs in its
# own Firecracker microVM with a dedicated guest kernel — hardware-
# enforced isolation suitable for untrusted code, strong multi-tenant
# boundaries, and the workload shapes gVisor structurally can't serve
# (dedicated cores, custom kernel, privileged/nested containers).
#
# Mode compatibility:
#   - Standard EKS (Karpenter): yes — requires the kata-fc RuntimeClass
#     + a nested-virt NodePool with the Kata+FC shim (see
#     runtimeclass-kata-fc.yaml + karpenter-nodepool-kata-fc.yaml).
#   - EKS Auto Mode: NO — Auto Mode gives no node-level hook to install
#     the Kata/FC shim or configure the devmapper snapshotter.
#
# Pod spec mirrors sandbox-runc / sandbox-gvisor exactly so a SandboxWarmPool
# can switch tiers by changing only sandboxTemplateRef.name — image
# distribution (SOCI) and egress labels are identical across tiers.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: sandbox-kata-fc
  namespace: agent-sandboxes
  labels:
    agent-sandbox/tier: kata-fc
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        egress-tier: sandbox
        agent-sandbox/tier: kata-fc
    spec:
      runtimeClassName: kata-fc
      tolerations:
        - key: agent-sandbox/runtime
          operator: Equal
          value: kata-fc
          effect: NoSchedule
      containers:
        - name: workload
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            # Hardened to match the runc/gVisor templates so tier
            # comparisons stay apples-to-apples — only the runtime +
            # toleration vary. The microVM boundary is the primary
            # isolation here; the PodSecurityContext is defense-in-depth.
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: var-cache
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: var-cache
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
