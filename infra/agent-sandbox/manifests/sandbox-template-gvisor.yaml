# SandboxTemplate — gVisor tier.
#
# gVisor's Sentry intercepts syscalls in userspace, providing a
# significantly stronger isolation boundary than runc's
# namespace+cgroup-only model at ~1.5s cold start cost (SPEC §3.1).
#
# Use for agents that execute code — the demo's reference agent claims
# this template to show syscall-level isolation during the
# code-execution step. Scheduling is constrained to gVisor-capable
# nodes via the runtimeClassName + NodePool label selector.
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: sandbox-gvisor
  namespace: agent-sandboxes
  labels:
    agent-sandbox/tier: gvisor
spec:
  # Let Cilium be the sole policy enforcement path. See
  # sandbox-template-standard.yaml for rationale.
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        egress-tier: sandbox
        agent-sandbox/tier: gvisor
    spec:
      runtimeClassName: gvisor
      # Tolerate the NoSchedule taint on gVisor nodes.
      tolerations:
        - key: agent-sandbox/runtime
          operator: Equal
          value: gvisor
          effect: NoSchedule
      containers:
        - name: agent-runtime
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            # gVisor doesn't require seccomp (Sentry's syscall
            # interception is the primary boundary), but keeping the
            # hardened PodSecurityContext aligns with the standard
            # template so tier comparisons are apples-to-apples.
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
