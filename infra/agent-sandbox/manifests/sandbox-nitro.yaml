# SandboxTemplate — AWS Nitro Sandbox on Amazon EKS tier (basic).
#
# Same shape as sandbox-gvisor, with runtimeClassName: isolated-sandbox in place
# of gvisor. The pod runs in its own hardware-isolated Nitro Sandbox: a guest
# microVM with its own kernel. The RuntimeClass carries the scheduling
# constraints, so no toleration or node selector is needed.
#
# Mode compatibility:
#   - EKS Auto Mode 1.36+: yes. The RuntimeClass is built in; claims choose
#     sandbox-runc or sandbox-nitro.
#   - Standard EKS: yes, on nodes that run a custom AMI with Nitro Sandbox
#     support.
#
# The pod-level sysctl lets the non-root nginx (user 101, all capabilities
# dropped) bind port 80, as it does in sandbox-runc and sandbox-gvisor. It is
# set in the guest kernel inside the pod's own microVM, not on the node, so it
# affects only this pod.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: sandbox-nitro
  namespace: agent-sandboxes
  labels:
    agent-sandbox/tier: nitro
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        egress-tier: sandbox
        agent-sandbox/tier: nitro
    spec:
      runtimeClassName: isolated-sandbox
      securityContext:
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: workload
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: var-cache
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: var-cache
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
