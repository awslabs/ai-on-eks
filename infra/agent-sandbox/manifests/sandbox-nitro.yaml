# SandboxTemplate — AWS Nitro Sandbox on Amazon EKS tier (basic).
#
# Same shape as sandbox-runc plus runtimeClassName: isolated-sandbox. The pod
# runs in its own hardware-isolated Nitro Sandbox. The RuntimeClass is present
# on every EKS Auto Mode cluster (1.36+) and carries the scheduling constraints,
# so no toleration or node selector is needed.
#
# Mode compatibility:
#   - EKS Auto Mode 1.36+: yes. Claims choose sandbox-runc or sandbox-nitro.
#   - Standard EKS: yes, on nodes that run a custom AMI with Nitro Sandbox
#     support.
#
# Default workload is nginxinc/nginx-unprivileged:alpine, the non-root build of
# the nginx image used by sandbox-runc, listening on 8080: the sandbox has its
# own kernel, and a non-root process with all capabilities dropped cannot bind
# a port below 1024 there.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: sandbox-nitro
  namespace: agent-sandboxes
  labels:
    agent-sandbox/tier: nitro
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        egress-tier: sandbox
        agent-sandbox/tier: nitro
    spec:
      runtimeClassName: isolated-sandbox
      containers:
        - name: workload
          image: nginxinc/nginx-unprivileged:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: var-cache
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: var-cache
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
