# Kata + Firecracker RuntimeClass — points at the containerd `kata-fc`
# handler that the Kata + Firecracker shim installs during node
# bootstrap. Sandboxes declaring `runtimeClassName: kata-fc` get a
# hardware-isolated microVM (KVM, customer-managed hypervisor) per pod —
# a stronger boundary than gVisor's userspace syscall interception, and
# the tier that clears gVisor's structural gaps (dedicated cores, custom
# guest kernel, privileged/nested containers) at a ~5s cold-start cost.
#
# The node selector constrains these pods to nested-virt-capable nodes
# that Karpenter labels in karpenter-nodepool-kata-fc.yaml.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-fc
  labels:
    agent-sandbox/tier: kata-fc
handler: kata-fc
scheduling:
  nodeSelector:
    agent-sandbox/runtime: kata-fc
  tolerations:
    - key: agent-sandbox/runtime
      operator: Equal
      value: kata-fc
      effect: NoSchedule
