# AgentSandbox ResourceGraphDefinition.
#
# Composes an agent-sandbox into a single user-facing CRD that picks
# a runtime tier + ServiceAccount + IRSA annotation in one declarative
# unit. Adapts the upstream examples/composing-sandbox-nw-policies/
# rgd.yaml from the kubernetes-sigs/agent-sandbox project — see
# SPECIFICATION.md §4.5.
#
# What this adds over the upstream example:
#   - runtimeClass field (standard | gvisor | kata-fc) that propagates
#     to the child Sandbox's podTemplate.runtimeClassName and the
#     matching NoSchedule toleration.
#   - iamRoleArn field that annotates the ServiceAccount for EKS
#     IRSA wiring (not Pod Identity — per SPEC §4.6.1, Pod Identity
#     can't route through gVisor's Sentry network namespace).
#
# Egress policy composition is deferred to a separate
# CiliumNetworkPolicy (see ciliumnetworkpolicy-sandbox-llm.yaml)
# because CEL expressions inside a KRO RGD can't yet produce the
# list-of-object shape that toFQDNs expects cleanly. A follow-up
# KRO update (tracked upstream in the CEL library changes described
# in the v0.9.0 release notes) may enable composing the policy
# inline; until then, the policy stays as a sibling manifest the
# user applies alongside the AgentSandbox instance.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: agent-sandbox
spec:
  schema:
    apiVersion: v1alpha1
    kind: AgentSandbox
    group: custom.agents.x-k8s.io
    spec:
      image: string | default="python:3.12-slim"
      runtimeClass: string | default="gvisor" enum="standard,gvisor,kata-fc"
      iamRoleArn: string | default=""
      command: "[]string"
    status:
      sandboxConditions: ${sandbox.status.conditions}
  resources:
    # 1. ServiceAccount with optional IRSA annotation.
    - id: sa
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          annotations:
            eks.amazonaws.com/role-arn: ${schema.spec.iamRoleArn}

    # 2. Sandbox — the core primitive. runtimeClassName is the tier
    #    choice cascading from the user-facing spec. podTemplate
    #    labels inherit the egress-tier label so the standalone
    #    CiliumNetworkPolicy (ciliumnetworkpolicy-sandbox-llm.yaml)
    #    selects its pod without reaching into the AgentSandbox name.
    - id: sandbox
      readyWhen:
        - ${sandbox.status.conditions.exists(x, x.type == "Ready" && x.status == "True")}
      template:
        apiVersion: agents.x-k8s.io/v1alpha1
        kind: Sandbox
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          podTemplate:
            metadata:
              labels:
                egress-tier: sandbox
                agent-sandbox/tier: ${schema.spec.runtimeClass}
                agent-sandbox/name: ${schema.metadata.name}
            spec:
              serviceAccountName: ${schema.metadata.name}
              runtimeClassName: ${schema.spec.runtimeClass}
              tolerations:
                - key: agent-sandbox/runtime
                  operator: Equal
                  value: ${schema.spec.runtimeClass}
                  effect: NoSchedule
              containers:
                - name: agent-runtime
                  image: ${schema.spec.image}
                  command: ${schema.spec.command}
