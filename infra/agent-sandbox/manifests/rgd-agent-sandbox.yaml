# AgentSandbox ResourceGraphDefinition.
#
# Composes an agent-sandbox into a single user-facing CRD that picks
# a runtime tier + FQDN allowlist in one declarative unit. Adapts the
# upstream examples/composing-sandbox-nw-policies/rgd.yaml from the
# kubernetes-sigs/agent-sandbox project — see SPECIFICATION.md §4.5.
#
# What this adds over the upstream example:
#   - runtimeClass field (standard | gvisor | kata-fc) that propagates
#     to the child Sandbox's podTemplate.runtimeClassName
#   - egressAllowlist field generating a CiliumNetworkPolicy rather
#     than a generic NetworkPolicy (FQDN-based, which is the project's
#     distinctive capability)
#   - iamRoleArn field that annotates the ServiceAccount for EKS Pod
#     Identity wiring
#
# This RGD is a stretch POC deliverable — applied only if time allows
# during the showcase. The demo story works without it; KRO is the
# "here's the one-CR abstraction we're building" narration beat.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: agent-sandbox
spec:
  schema:
    apiVersion: v1alpha1
    group: custom.agents.x-k8s.io
    kind: AgentSandbox
    spec:
      image: string | default="python:3.12-slim"
      runtimeClass: string | default="gvisor" enum="standard,gvisor,kata-fc"
      iamRoleArn: string | default=""
      egressAllowlist: "[]string"
      command: "[]string"
    status:
      sandboxConditions: ${sandbox.status.conditions}
      policyName: ${policy.metadata.name}
  resources:
    # 1. ServiceAccount with optional IRSA / Pod Identity annotation.
    - id: sa
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          annotations:
            eks.amazonaws.com/role-arn: ${schema.spec.iamRoleArn}

    # 2. Sandbox — the core primitive. runtimeClassName is the tier
    #    choice cascading from the user-facing spec. podTemplate
    #    labels inherit the egress-tier label so the generated
    #    CiliumNetworkPolicy below selects it.
    - id: sandbox
      readyWhen:
        - ${sandbox.status.conditions.exists(x, x.type == "Ready" && x.status == "True")}
      template:
        apiVersion: agents.x-k8s.io/v1alpha1
        kind: Sandbox
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          podTemplate:
            metadata:
              labels:
                egress-tier: sandbox
                agent-sandbox/tier: ${schema.spec.runtimeClass}
                agent-sandbox/name: ${schema.metadata.name}
            spec:
              serviceAccountName: ${schema.metadata.name}
              runtimeClassName: ${schema.spec.runtimeClass}
              tolerations:
                - key: agent-sandbox/runtime
                  operator: Equal
                  value: ${schema.spec.runtimeClass}
                  effect: NoSchedule
              containers:
                - name: agent-runtime
                  image: ${schema.spec.image}
                  command: ${schema.spec.command}

    # 3. CiliumNetworkPolicy — per-sandbox FQDN allowlist. Only
    #    matches this AgentSandbox's pod via the agent-sandbox/name
    #    label so sibling sandboxes in the same namespace get their
    #    own policy instance.
    - id: policy
      template:
        apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        metadata:
          name: ${schema.metadata.name}-egress
          namespace: ${schema.metadata.namespace}
        spec:
          description: FQDN allowlist for AgentSandbox ${schema.metadata.name}
          endpointSelector:
            matchLabels:
              agent-sandbox/name: ${schema.metadata.name}
          egress:
            # DNS always allowed — needed for FQDN lookups below.
            - toEndpoints:
                - matchLabels:
                    k8s:io.kubernetes.pod.namespace: kube-system
                    k8s-app: kube-dns
              toPorts:
                - ports:
                    - port: "53"
                      protocol: UDP
                  rules:
                    dns:
                      - matchPattern: "*"
            # User-provided FQDN allowlist — spec.egressAllowlist is a
            # list of hostnames the sandbox can reach.
            - toFQDNs: ${schema.spec.egressAllowlist}
              toPorts:
                - ports:
                    - port: "443"
                      protocol: TCP
