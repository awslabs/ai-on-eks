# SandboxTemplate — standard tier (runc).
#
# This is the baseline tier per SPEC §3.1 — namespace + cgroup
# isolation via runc, the default Kubernetes container runtime. Use
# for orchestration-only agents making LLM calls without executing
# untrusted code. Cold start ~1s; no additional isolation cost.
#
# Tier selection: orchestration-only agents (LLM calls, no code
# execution) claim this template; agents that execute untrusted
# code should claim the gVisor template instead.
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: sandbox-standard
  namespace: agent-sandboxes
  labels:
    agent-sandbox/tier: standard
spec:
  # Let Cilium be the sole policy enforcement path. The controller's
  # default is Managed, which auto-creates a kubernetes.io/v1
  # NetworkPolicy alongside the Sandbox — functionally equivalent
  # for default-allow workloads but creates two policy surfaces to
  # reason about when debugging. Unmanaged = one policy surface,
  # easier to audit.
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        # Propagated to the child Sandbox pod so the per-sandbox
        # CiliumNetworkPolicy can match on egress-tier=sandbox.
        egress-tier: sandbox
        agent-sandbox/tier: standard
    spec:
      # No runtimeClassName → runc (cluster default).
      containers:
        - name: agent-runtime
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          # Keep the sandbox alive until the agent explicitly shuts it
          # down. The reference agent runs inside via kubectl exec
          # rather than as the pod entrypoint — matches the SIG-Apps
          # singleton-stateful pattern.
          command: ["/bin/sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            # Non-root + read-only root filesystem as baseline hardening.
            # The agent writes only to /tmp and /workspace (emptyDir).
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
