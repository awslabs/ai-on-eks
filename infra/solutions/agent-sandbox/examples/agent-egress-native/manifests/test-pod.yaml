# Minimal test pod for validating native ApplicationNetworkPolicy
# enforcement on an EKS Auto Mode cluster.
#
# Not intended to be part of the blueprint's production install path —
# this manifest exists so maintainers can reproduce the P1.F live
# validation recipe without running the full agent-sandbox stack.
#
# Usage:
#   kubectl apply -f manifests/test-pod.yaml
#   kubectl -n agent-sandboxes wait --for=condition=Ready pod/egress-test --timeout=120s
#   # Allowed FQDN (from the default sandbox-llm-allowlist ANP):
#   kubectl -n agent-sandboxes exec egress-test -- curl -sS -o /dev/null -w '%{http_code}\n' --max-time 5 https://pypi.org
#   # Blocked FQDN (not in the allowlist — expect DNS failure):
#   kubectl -n agent-sandboxes exec egress-test -- curl -sS -o /dev/null -w '%{http_code}\n' --max-time 5 https://blocked-example.example.com
#   kubectl delete -f manifests/test-pod.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-sandboxes
  labels:
    agent-sandbox: enabled
---
apiVersion: v1
kind: Pod
metadata:
  name: egress-test
  namespace: agent-sandboxes
  labels:
    egress-tier: sandbox
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["/bin/sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
