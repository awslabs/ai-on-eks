# Disable MOFED
mofedEnabled: false

# Target only nodes running AL2023 AMIs
nodeSelector:
  ai-on-eks.io/amiFamily: al2023

# Enable GPU Feature Discovery (default: false)
gfd:
  enabled: true

# Configure Node Feature Discovery components
nfd:
  master:
    config:
      extraLabelNs:
      - "ai-on-eks.io"
      - "vpc.amazonaws.com"
      - "nvidia.com"
  worker:
    tolerations:
      - operator: "Exists"
    config:
      core:
        labelSources: ["all"]
      sources:
        custom:
          - name: "label amiFamily for al2023"
            labels:
              "ai-on-eks.io/amiFamily": "al2023"
            matchFeatures:
              - feature: system.osRelease
                matchExpressions:
                  ID: {op: In, value: ["amzn"]}
                  VERSION_ID: {op: In, value: ["2023"]}
          - name: "label amiFamily for bottlerocket"
            labels:
              "ai-on-eks.io/amiFamily": "bottlerocket"
            matchFeatures:
              - feature: system.osRelease
                matchExpressions:
                  ID: {op: In, value: ["bottlerocket"]}
          - name: "nvidia labels"
            labels:
              nvidia.com/gpu.present: "true"
            matchFeatures:
              - feature: pci.device
                matchExpressions:
                  vendor: {op: In, value: ["10de"]}
          - name: "aws-efa"
            labels:
              "vpc.amazonaws.com/efa.present": "true"
            matchFeatures:
              - feature: pci.device
                matchExpressions:
                  vendor: {op: In, value: ["1d0f"]}
                  device: {op: InRegexp, value: ["^efa"]}
