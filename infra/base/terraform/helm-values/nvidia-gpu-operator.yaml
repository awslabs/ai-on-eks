clusterPolicy:
  deployCR: ${enable_cluster_policy}

gpuCluster:
  deployCR: ${enable_gpu_cluster}

# Node feature discovery
nfd:
  enabled: true

node-feature-discovery:
  master:
    config:
      extraLabelNs:
      - "ai-on-eks.io"
      - "vpc.amazonaws.com"
      - "nvidia.com"
  worker:
    tolerations:
      - operator: "Exists"
    config:
      core:
        labelSources: ["all"]
      sources:
        custom:
          - name: "label amiFamily for al2023"
            labels:
              "ai-on-eks.io/amiFamily": "al2023"
            matchFeatures:
              - feature: system.osRelease
                matchExpressions:
                  ID: {op: In, value: ["amzn"]}
                  VERSION_ID: {op: In, value: ["2023"]}
          - name: "label amiFamily bottlerocket"
            labels:
              "ai-on-eks.io/amiFamily": "bottlerocket"
            matchFeatures:
              - feature: system.osRelease
                matchExpressions:
                  ID: {op: In, value: ["bottlerocket"]}
          - name: "disable gpu-operator operands on bottlerocket"
            labels:
              nvidia.com/gpu.deploy.device-plugin: "false"
              nvidia.com/gpu.deploy.driver: "false"
              nvidia.com/gpu.deploy.mig-manager: "false"
              nvidia.com/gpu.deploy.container-toolkit: "false"
            matchFeatures:
              - feature: system.osRelease
                matchExpressions:
                  ID: {op: In, value: ["bottlerocket"]}
              - feature: pci.device
                matchExpressions:
                  vendor: {op: In, value: ["10de"]}
          - name: "aws-efa"
            labels:
              "vpc.amazonaws.com/efa.present": "true"
            matchFeatures:
              - feature: pci.device
                matchExpressions:
                  vendor: {op: In, value: ["1d0f"]}
                  device: {op: InRegexp, value: ["^efa"]}

# GPU feature discovery
gfd:
  enabled: true

# Enable MIG support with mixed strategy
mig:
  strategy: mixed  # Supports both MIG and non-MIG workloads

# Disable driver installation since EKS AMI already has drivers
driver:
  enabled: false

# EKS AMIs come with the container toolkit installed
toolkit:
  enabled: false

# Device plugin configuration
devicePlugin:
  enabled: ${enable_device_plugin}
  env:
    - name: MOFED_ENABLED
      value: "false"
    - name: GDRCOPY_ENABLED
      value: "true"

# DCGM service (nv-hostengine)
# EKS Auto Mode nodes already run nv-hostengine on localhost:5555
dcgm:
  enabled: ${!enable_eks_auto_mode}

# DCGM exporter for monitoring
dcgmExporter:
  enabled: ${enable_dcgm_exporter}
  enablePodLabels: true
  enablePodUID: true
%{ if enable_eks_auto_mode ~}
  hostNetwork: true
  env:
    - name: DCGM_REMOTE_HOSTENGINE_INFO
      value: "localhost:5555"
%{ endif ~}
  serviceMonitor:
    enabled: ${dcgm_exporter_service_monitor_enabled}
    interval: 15s
    honorLabels: false
    additionalLabels:
      release: kube-prometheus-stack
  config:
    create: true
    name: custom-dcgm-exporter-metrics
    data: |
      ${indent(6, dcgm_exporter_metrics)}

# Node status exporter
nodeStatusExporter:
  enabled: false

# Sandbox device plugin
sandboxDevicePlugin:
  enabled: false

kataSandboxDevicePlugin:
  enabled: false

# MIG Manager configuration, auto generated MIG profiles
migManager:
  enabled: ${enable_mig_manager}
  env:
    - name: WITH_REBOOT
      value: "true"
