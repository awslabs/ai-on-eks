apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-neuron-device-plugin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: public.ecr.aws/neuron
    chart: neuron-helm-chart
    targetRevision: ${version}
    helm:
      values: |
        scheduler:
          enabled: true
          customScheduler:
            fullnameOverride: neuron-scheduler
        npd:
          fullnameOverride: neuron-npd
          namespaceOverride: null
        # Keep the device plugin off DRA nodes — the device plugin and the
        # Neuron DRA driver must not manage the same node. The `neuron` NodePool
        # carries this label; custom neuron NodePools must set it too.
        devicePlugin:
          nodeSelector:
            neuron.aws/driver: device-plugin

  destination:
    server: https://kubernetes.default.svc
    namespace: neuron-device-plugin
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
