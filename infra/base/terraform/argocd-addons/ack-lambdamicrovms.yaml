apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ack-lambdamicrovms
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # ACK service controller for AWS Lambda MicroVMs. Provides the
    # Microvm / MicrovmImage CRDs + reconciler so MicroVM fleets are
    # managed as Kubernetes resources (declarative create/terminate,
    # status.endpoint / state surfaced on the CR). Consumed by
    # agent-sandbox dispatch patterns as the off-cluster execution
    # tier alongside the in-cluster SandboxClaim tiers.
    repoURL: public.ecr.aws/aws-controllers-k8s
    chart: lambdamicrovms-chart
    targetRevision: ${version}
    helm:
      valuesObject:
        aws:
          region: ${region}
        serviceAccount:
          create: true
          name: ack-lambdamicrovms-controller
          annotations:
            # IRSA role created in argocd_addons.tf with the
            # controller's recommended inline policy (Lambda MicroVM
            # APIs + scoped iam:PassRole to lambda.amazonaws.com).
            eks.amazonaws.com/role-arn: ${role_arn}
  destination:
    server: https://kubernetes.default.svc
    namespace: ack-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
