apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-neuron-dra-driver
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: public.ecr.aws/neuron
    chart: neuron-helm-chart
    targetRevision: ${version}
    helm:
      # Lets ArgoCD render/diff the DRA CRDs (DeviceClass, ResourceSlice, ...).
      apiVersions:
        - "v1/resource.k8s.io"
      values: |
        ${user_values_yaml}
  destination:
    server: https://kubernetes.default.svc
    namespace: neuron-dra-driver
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
