%{ for instance_type, network_interfaces_yaml in jsondecode(efa_network_interfaces) ~}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-${replace(instance_type, ".", "-")}
spec:
  weight: 10
  disruption:
    budgets:
      - nodes: 10%
    consolidateAfter: 300s
    consolidationPolicy: WhenEmptyOrUnderutilized
  template:
    metadata:
      labels:
        ai-on-eks.io/amiFamily: ${ami_family}
        accelerator: nvidia
    spec:
      expireAfter: 720h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-${replace(instance_type, ".", "-")}
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["${instance_type}"]
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - reserved
            - spot
            - on-demand
%{ if fsx_efa_enabled ~}
        # FSx for Lustre is single-AZ; EFA requires the GPU node in that same AZ.
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["${fsx_availability_zone}"]
%{ endif ~}
      taints:
        - effect: NoSchedule
          key: nvidia.com/gpu
      terminationGracePeriod: 24h
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-${replace(instance_type, ".", "-")}
spec:
  ${indent(2, fsx_efa_enabled ? ec2nodeclass_fsx : ec2nodeclass)}
  ${indent(2, network_interfaces_yaml)}
%{ endfor ~}
