# This is a sample to deploy a milvus cluster with minimum cost of resources.
# It should be used for testing and development purposes only.
# Total resources required is about: 0.25 CPU, 512 MiB memory
# When deleted, all the data in the Milvus will be lost.

apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: my-release
  labels:
    app: milvus
    namespace: milvus
spec:
  mode: cluster
  config: {}
  components:
    enableRollingUpdate: true
    imageUpdateMode: rollingUpgrade
    nodeSelector:
      instanceType: arm64-cpu-ssd-karpenter
    proxy:
      replicas: 1
      serviceType: ClusterIP
    dataNode:
      replicas: 1
    indexNode:
      replicas: 1
    queryNode:
      replicas: 1
    mixCoord:
      replicas: 1
  dependencies:
    etcd:
      inCluster:
        values:
          replicaCount: 1
        deletionPolicy: Delete
        pvcDeletion: true
    storage:
      inCluster:
        values:
          mode: standalone
          resources:
            requests:
              memory: 100Mi
          persistence:
            size: 20Gi
        deletionPolicy: Delete
        pvcDeletion: true
    msgStreamType: pulsar
