# Reference SandboxClaim — the per-instance binding that points at one
# of the SandboxTemplates and provides the per-deployment glue
# (ServiceAccount + agent-script ConfigMap).
#
# This is the SandboxClaim variant of the SIG-Apps agent-sandbox API
# pattern: the runtime spec (image, env vars, security context, volume
# layout) lives in the SandboxTemplate; the claim adds only the bits
# that are deployment-specific — IRSA wiring on the SA, the script
# ConfigMap the agent reads, and a pointer to the chosen template.
#
# Template selection is deferred to apply time:
#   - Standard EKS → templateRef.name = sandbox-agent-gvisor
#   - EKS Auto Mode → templateRef.name = sandbox-agent-standard
# The conformance script and the install path render the right value
# into __SANDBOX_TEMPLATE__ before applying. Customers adopting the
# blueprint can hardcode whichever tier matches their cluster.
#
# IAM:
#   - The ServiceAccount is annotated with the IRSA role at install
#     time. Pod Identity is NOT used because gVisor's Sentry network
#     namespace doesn't forward the link-local route to the Pod
#     Identity credential endpoint at 169.254.170.23 — IRSA routes
#     through STS over the regular network path, which works on both
#     gVisor and standard tiers.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-agent-sa
  namespace: agent-sandboxes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-agent-script
  namespace: agent-sandboxes
  labels:
    agent-sandbox/role: runtime
data:
  # Actual contents populated by install.sh / conformance.sh via
  #   kubectl create configmap --from-file=agent.py=...
  # This placeholder keeps the manifest self-contained for review.
  agent.py: "# populated by install.sh from blueprints/agent-sandbox/agent.py"
---
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxClaim
metadata:
  name: sandbox-agent
  namespace: agent-sandboxes
  labels:
    agent-sandbox/role: runtime
spec:
  # Patched at apply time. See header comment for tier-selection rules.
  sandboxTemplateRef:
    name: __SANDBOX_TEMPLATE__
