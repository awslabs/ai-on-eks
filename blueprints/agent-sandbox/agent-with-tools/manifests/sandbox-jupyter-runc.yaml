# SandboxTemplate — data-analysis (runc tier).
#
# Data-analysis sandbox: Python with numpy/pandas/matplotlib for the
# data_analysis_execute tool. The agent reuses one sandbox pod per
# conversation session to avoid repeated cold starts, but each tool call
# runs a fresh `python` process — interpreter state (variables, imports,
# dataframes) does NOT persist across calls.
#
# Image: python:3.12-slim with numpy/pandas/matplotlib pre-installed
# at pod startup (written to /workspace/.local via pip install --user).
# This keeps the same non-root security posture as the code-exec template.
#
# Mode compatibility:
#   - Standard EKS (Karpenter): yes
#   - EKS Auto Mode: yes
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: sandbox-jupyter-runc
  namespace: agent-sandboxes
  labels:
    agent-sandbox/tier: runc
    agent-sandbox/role: jupyter
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        egress-tier: sandbox
        agent-sandbox/tier: runc
        agent-sandbox/role: jupyter
        agent-sandbox/managed-by: agent-with-tools
    spec:
      containers:
        - name: data-analysis-runtime
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              pip install --no-cache-dir --disable-pip-version-check --user \
                numpy pandas matplotlib
              echo "data-analysis sandbox ready — data science libraries installed"
              sleep infinity
          env:
            - name: HOME
              value: /workspace
            - name: MPLBACKEND
              value: Agg
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# Companion warm pool (agent-sandbox v1.0 / v1beta1: SandboxClaims check
# out from a SandboxWarmPool via warmPoolRef; claims no longer reference
# templates directly). replicas: 1 keeps one sandbox pre-warmed so a
# tool call binds in seconds instead of paying pod cold-start — the
# latency profile this per-tool-call pattern wants. Set replicas: 0 to
# trade that latency back for zero idle cost (claims then cold-start
# from the template on demand).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: sandbox-jupyter-runc-pool
  namespace: agent-sandboxes
  labels:
    agent-sandbox/managed-by: agent-with-tools
spec:
  replicas: 1
  sandboxTemplateRef:
    name: sandbox-jupyter-runc
