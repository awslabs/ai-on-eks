# Dispatchable worker, default runtime (runc tier).
# The tier label on the SandboxWarmPool below is the registry entry.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: dispatch-worker
  namespace: agent-sandboxes
  labels:
    agent-sandbox/managed-by: dispatch
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        egress-tier: sandbox
        agent-sandbox/tier: runc
    spec:
      containers:
        - name: runtime
          image: registry.k8s.io/agent-sandbox/python-runtime-sandbox:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            # v1.0 runtime feature: relocate the working base dir onto
            # the writable mount so readOnlyRootFilesystem holds.
            - name: SANDBOX_BASE_DIR
              value: /workspace
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# replicas: 1 pre-warms one worker. Bump for burst, 0 for zero idle cost.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: dispatch-worker-pool
  namespace: agent-sandboxes
  labels:
    agent-sandbox/tier: runc
    agent-sandbox/managed-by: dispatch
spec:
  replicas: 1
  sandboxTemplateRef:
    name: dispatch-worker
