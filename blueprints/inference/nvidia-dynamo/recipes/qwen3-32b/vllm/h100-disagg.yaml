apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-32b-h100-disagg-vllm
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: nvidia.com/dynamo-graph-deployment-name
                          operator: In
                          values:
                            - qwen3-32b-h100-disagg-vllm
                    topologyKey: topology.kubernetes.io/zone
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.6.0
              envFrom:
              - secretRef:
                  name: hf-token-secret
              env:
                - name: HF_HOME
                  value: /models
                - name: HF_HUB_OFFLINE
                  value: "1"
              resources:
                requests:
                  cpu: "8"
                  memory: "16Gi"
                limits:
                  memory: "16Gi"
              volumeMounts:
                - name: model-cache
                  mountPath: /models
              command:
                - /bin/sh
                - -c
              args:
                - |
                  python3 -m dynamo.frontend --router-mode kv

    - name: DecodeWorker
      type: decode
      replicas: 1
      sharedMemorySize: 100Gi
      podTemplate:
        metadata:
          labels:
            role: worker
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                    - p5.48xlarge
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: nvidia.com/dynamo-graph-deployment-name
                        operator: In
                        values:
                          - qwen3-32b-h100-disagg-vllm
                      - key: role
                        operator: In
                        values:
                          - worker
                  topologyKey: topology.kubernetes.io/zone
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-efa
              envFrom:
              - secretRef:
                  name: hf-token-secret
              env:
                - name: MODEL_NAME
                  value: "Qwen/Qwen3-32B"
                - name: HF_HOME
                  value: /models
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: NCCL_NET_PLUGIN
                  value: "ofi"
                - name: NCCL_TUNER_PLUGIN
                  value: "ofi"
              command:
                - /bin/sh
                - -c
              args:
                - |
                  python3 -m dynamo.vllm \
                    --model "${MODEL_NAME}" \
                    --served-model-name "${MODEL_NAME}" \
                    --tensor-parallel-size 4 \
                    --gpu-memory-utilization 0.90 \
                    --async-scheduling \
                    --block-size 64 \
                    --hf-overrides '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768},"max_position_embeddings":131072}' \
                    --max-model-len 131072 \
                    --disaggregation-mode decode \
                    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_connector_extra_config": {"backends": ["LIBFABRIC"]}}' \
                    --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
              resources:
                requests:
                  nvidia.com/gpu: 4
                  vpc.amazonaws.com/efa: 16
                limits:
                  nvidia.com/gpu: 4
                  vpc.amazonaws.com/efa: 16
              volumeMounts:
                - name: model-cache
                  mountPath: /models
              securityContext:
                capabilities:
                  add:
                    - IPC_LOCK
              startupProbe:
                httpGet:
                  path: /health
                  port: 9090
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 540

    - name: PrefillWorker
      type: prefill
      replicas: 1
      sharedMemorySize: 100Gi
      podTemplate:
        metadata:
          labels:
            role: worker
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                    - p5.48xlarge
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: nvidia.com/dynamo-graph-deployment-name
                        operator: In
                        values:
                          - qwen3-32b-h100-disagg-vllm
                      - key: role
                        operator: In
                        values:
                          - worker
                  topologyKey: topology.kubernetes.io/zone
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.1-efa
              envFrom:
              - secretRef:
                  name: hf-token-secret
              env:
                - name: MODEL_NAME
                  value: "Qwen/Qwen3-32B"
                - name: HF_HOME
                  value: /models
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: NCCL_NET_PLUGIN
                  value: "ofi"
                - name: NCCL_TUNER_PLUGIN
                  value: "ofi"
              command:
                - /bin/sh
                - -c
              args:
                - |
                  python3 -m dynamo.vllm \
                    --model "${MODEL_NAME}" \
                    --served-model-name "${MODEL_NAME}" \
                    --tensor-parallel-size 4 \
                    --gpu-memory-utilization 0.90 \
                    --async-scheduling \
                    --block-size 64 \
                    --hf-overrides '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768},"max_position_embeddings":131072}' \
                    --max-model-len 131072 \
                    --disaggregation-mode prefill \
                    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_connector_extra_config": {"backends": ["LIBFABRIC"]}}' \
                    --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
              resources:
                requests:
                  nvidia.com/gpu: 4
                  vpc.amazonaws.com/efa: 16
                limits:
                  nvidia.com/gpu: 4
                  vpc.amazonaws.com/efa: 16
              volumeMounts:
                - name: model-cache
                  mountPath: /models
              securityContext:
                capabilities:
                  add:
                    - IPC_LOCK
              startupProbe:
                httpGet:
                  path: /health
                  port: 9090
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 540
