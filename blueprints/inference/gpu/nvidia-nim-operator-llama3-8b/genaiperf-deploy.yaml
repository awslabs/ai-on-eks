apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-perf
spec:
  selector:
    matchLabels:
      app: genai-perf
  template:
    metadata:
      labels:
        app: genai-perf
    spec:
      containers:
      - name: triton
        image: nvcr.io/nvidia/tritonserver:24.12-py3-sdk
        command:
        - sleep
        - infinity
        imagePullPolicy: IfNotPresent
        # GenAI-Perf is a client: it sends requests to the NIM endpoint and needs no GPU
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
