# NVIDIA GPU DeviceClass for DRA on EKS Auto Mode, exactly as published in
# https://docs.aws.amazon.com/eks/latest/userguide/device-management-nvidia-dra-device-plugin.html#eks-nvidia-dra-deviceclass
#
# EKS Auto Mode runs the NVIDIA DRA driver from the node runtime rather than
# from a Helm chart, so the DeviceClass is not created for you. A claim that
# references a DeviceClass that does not exist is never allocated and the Pod
# stays Pending.
#
# extendedResourceName: nvidia.com/gpu is deliberately omitted. The driver's
# Helm chart sets it on Kubernetes 1.34+, but it makes DRA satisfy every plain
# nvidia.com/gpu request cluster-wide, which on EKS Auto Mode also decides
# whether a node becomes a DRA node or a device plugin node.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gpu.nvidia.com
spec:
  selectors:
  - cel:
      expression: "device.driver == 'gpu.nvidia.com' && device.attributes['gpu.nvidia.com'].type == 'gpu'"
